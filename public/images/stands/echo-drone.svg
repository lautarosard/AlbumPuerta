<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Placeholder artwork: replace with the stand's real photo. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.4" fill="#FFEB3B" opacity="0.3"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33300b"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#dots)"/>
  <!-- Sound rings -->
  <g fill="none" stroke="#FFEB3B" stroke-width="8">
    <circle cx="300" cy="560" r="80" opacity="0.9"/>
    <circle cx="300" cy="560" r="150" opacity="0.6"/>
    <circle cx="300" cy="560" r="220" opacity="0.3"/>
  </g>
  <!-- Drone -->
  <g transform="translate(300 300)">
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M-150 -40 L150 40"/>
      <path d="M-150 40 L150 -40"/>
    </g>
    <g fill="#8A2BE2" stroke="#FFFFFF" stroke-width="6">
      <ellipse cx="-150" cy="-40" rx="70" ry="14"/>
      <ellipse cx="150" cy="-40" rx="70" ry="14"/>
      <ellipse cx="-150" cy="40" rx="70" ry="14"/>
      <ellipse cx="150" cy="40" rx="70" ry="14"/>
    </g>
    <rect x="-60" y="-34" width="120" height="68" rx="20" fill="#FFEB3B" stroke="#121212" stroke-width="6"/>
    <circle cx="0" cy="0" r="16" fill="#121212"/>
  </g>
</svg>
