<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Placeholder artwork: replace with the stand's real photo. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.4" fill="#E6007E" opacity="0.35"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0322"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#dots)"/>
  <!-- Pixel mural being painted by many phones -->
  <g transform="translate(120 170)">
    <rect x="0" y="0" width="60" height="60" fill="#E6007E"/>
    <rect x="60" y="0" width="60" height="60" fill="#00E5FF"/>
    <rect x="180" y="0" width="60" height="60" fill="#FFEB3B"/>
    <rect x="300" y="0" width="60" height="60" fill="#8A2BE2"/>
    <rect x="0" y="60" width="60" height="60" fill="#8A2BE2"/>
    <rect x="120" y="60" width="60" height="60" fill="#E6007E"/>
    <rect x="240" y="60" width="60" height="60" fill="#00E5FF"/>
    <rect x="60" y="120" width="60" height="60" fill="#FFEB3B"/>
    <rect x="180" y="120" width="60" height="60" fill="#E6007E"/>
    <rect x="300" y="120" width="60" height="60" fill="#FFEB3B"/>
    <rect x="0" y="180" width="60" height="60" fill="#00E5FF"/>
    <rect x="120" y="180" width="60" height="60" fill="#8A2BE2"/>
    <rect x="240" y="180" width="60" height="60" fill="#E6007E"/>
    <rect x="60" y="240" width="60" height="60" fill="#E6007E"/>
    <rect x="180" y="240" width="60" height="60" fill="#00E5FF"/>
    <rect x="300" y="240" width="60" height="60" fill="#8A2BE2"/>
  </g>
  <!-- Phone silhouette -->
  <g transform="translate(330 470) rotate(12)">
    <rect width="150" height="260" rx="22" fill="#121212" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="22" y="34" width="106" height="180" rx="6" fill="#E6007E" opacity="0.8"/>
  </g>
</svg>
